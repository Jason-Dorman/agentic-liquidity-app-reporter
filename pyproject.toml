[project]
name = "daily-review"
version = "0.1.0"
description = "Blockford Daily Review: a read-only daily review agent over the Blockford app API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
daily-review = "daily_review.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# C90 cyclomatic complexity (ENGINEERING-PRINCIPLES: under 10).
select = ["E", "W", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
